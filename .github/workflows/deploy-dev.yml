name: Deploy Dev Environment

on:
  workflow_dispatch: # Allows manual trigger via Github UI
  push:
    # Runs on main and feature branches
    branches:
      - '**'
      - '!staging'
      - '!review/room-container-permissions'
      - '!review/forecast-arithmetic'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.get_url.outputs.app_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}

      - name: Log in to ACR via Azure CLI
        run: | 
          az acr login --name supplysmartACR

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: supplysmartacr.azurecr.io/supplysmart-app:dev-${{ github.sha }}

      - name: Deploy to Azure Container App
        env:
          APP_NAME: supplysmart-dev
          IMAGE: supplysmartacr.azurecr.io/supplysmart-app:dev-${{ github.sha }}
          FRONTEND_URL: https://supplysmart-dev.blackgrass-3604f914.eastus2.azurecontainerapps.io
          CONTAINER_APP_ENVIRONMENT: ${{ vars.CONTAINER_APP_ENVIRONMENT }}
          DATABASE_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING_DEV }}
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_STARTER_PRICE_ID: ${{ secrets.STRIPE_STARTER_PRICE_ID }}
          STRIPE_PROFESSIONAL_PRICE_ID: ${{ secrets.STRIPE_PROFESSIONAL_PRICE_ID }}
          STRIPE_ENTERPRISE_PRICE_ID: ${{ secrets.STRIPE_ENTERPRISE_PRICE_ID }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: bash .github/scripts/deploy-container-app.sh

      - name: Get Deployment URL
        id: get_url
        run: |
          FQDN=$(az containerapp show \
            --name supplysmart-dev \
            --resource-group rg-supplysmart \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          echo "app_url=https://$FQDN" >> $GITHUB_OUTPUT
